[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-backend"
version = "0.1.0"
description = "Generic document and knowledge lifecycle backend."
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "bounded-compliance-agent>=0.1,<0.2",
    "celery[redis]>=5.6,<5.7",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "minio>=7.2,<8.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "SQLAlchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
    "urllib3>=2.0,<3.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79
target-version = "py311"
