[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-rag-core"
version = "0.1.0"
description = "Provider-neutral ingestion, indexing, retrieval, and grounded generation."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.24,<2.0",
]
openai = [
    "openai>=1.109,<2.0",
]
qdrant = [
    "qdrant-client>=1.20,<2.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79
target-version = "py311"
